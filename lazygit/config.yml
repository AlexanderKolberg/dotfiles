gui:
  nerdFontsVersion: "3"
  theme:
  # activeBorderColor:
  #   - yellow
  #   - reverse
  # inactiveBorderColor:
  #   - "#3a3a3a"
  border: 'rounded' # one of 'single' | 'double' | 'rounded' | 'hidden'
git:
  pagers:
    - colorArg: never
      pager: delta --paging=never
      useConfig: false
  commit:
    signOff: false
  merging:
    # only applicable to unix users
    manualCommit: false
    # extra args passed to `git merge`, e.g. --no-ff
    args: "--no-ff"
  log:
    showGraph: always
    showWholeGraph: true
