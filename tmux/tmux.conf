unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g detach-on-destroy off
bind-key x kill-pane

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'

bind -r g popup -d '#{pane_current_path}' -E -w 90% -h 90% lazygit
bind -r e popup -d '#{pane_current_path}' -E -w 90% -h 90% gh dash
bind -r n popup -d '#{pane_current_path}' -E -w 90% -h 90% nvim .

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key "K" display-popup -E -w 40% "sesh connect \"$(
	sesh list -i | gum filter --limit 1 --fuzzy --no-sort --placeholder 'Pick a sesh' --prompt='⚡'
)\""

bind-key "R" display-popup -E -w 40% "sesh connect \"$(
  sesh list -i -H | gum filter --value \"$(sesh root)\" --limit 1 --fuzzy --no-sort --placeholder 'Pick a sesh' --prompt='⚡'readme
)\""


black="#282c34"
blue="#61afef"
yellow="#e5c07b"
red="#e06c75"
white="#aab2bf"
green="#98c379"
visual_grey="#3e4452"
comment_grey="#5c6370"

set-option -g display-panes-colour "$blue"
set-option -g display-panes-active-colour "$yellow"
set-option -g message-style fg="$white",bg="$black"
set-option -g message-command-style fg="$white",bg="$black"
set-option -g pane-border-style fg="$comment_grey"
set-option -g pane-active-border-style fg="$white"
set-option -g status-style fg="$white",bg="$black"
set -g status-right ""

set-window-option -g clock-mode-colour "$blue"
set-window-option -g window-status-style fg="$white",bg="$black"
set-window-option -g window-status-current-style fg="$blue",bg="$black"
set-window-option -g window-status-activity-style fg="$blue",bg="$black"
set-window-option -g window-status-bell-style fg="$black",bg="$blue"

run '~/.config/tmux/plugins/tpm/tpm'
